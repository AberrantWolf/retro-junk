[workspace]
resolver = "2"
members = [
    "retro-junk-cli",
    "retro-junk-gui",
    "retro-junk-core",
    "retro-junk-lib",
    "retro-junk-dat",
    "retro-junk-nintendo",
    "retro-junk-sony",
    "retro-junk-sega",
    "retro-junk-microsoft",
    "retro-junk-scraper",
    "retro-junk-frontend",
    "retro-junk-catalog",
    "retro-junk-db",
    "retro-junk-import",
    "retro-junk-disc",
    "retro-junk-archive",
    "retro-junk-archive-import",
    "retro-junk-io",
    "retro-junk-work",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AberrantWolf/retro-junk"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Numeric-cast pedantry is allowed: sizes in this domain are ROM/disc sizes
# (far below 2^52) on 64-bit targets, and GUI math is bounded; converting
# every cast to try_from would add error paths that cannot fire.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Error/panic conditions are documented on the thiserror enums themselves;
# repeating a "# Errors" section on every Result-returning function in an
# internal workspace adds noise, not information.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
retro-junk-core = { path = "retro-junk-core" }
retro-junk-lib = { path = "retro-junk-lib" }
retro-junk-nintendo = { path = "retro-junk-nintendo" }
retro-junk-sony = { path = "retro-junk-sony" }
retro-junk-sega = { path = "retro-junk-sega" }
retro-junk-microsoft = { path = "retro-junk-microsoft" }
retro-junk-dat = { path = "retro-junk-dat" }
retro-junk-disc = { path = "retro-junk-disc" }
retro-junk-archive = { path = "retro-junk-archive" }
retro-junk-archive-import = { path = "retro-junk-archive-import" }
retro-junk-io = { path = "retro-junk-io" }
retro-junk-work = { path = "retro-junk-work" }
retro-junk-catalog = { path = "retro-junk-catalog" }
retro-junk-db = { path = "retro-junk-db" }
retro-junk-import = { path = "retro-junk-import" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
owo-colors = { version = "4", features = ["supports-colors"] }
sha2 = "0.10"
quick-xml = "0.37"
crc32fast = "1.4"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset", "http2", "macos-system-configuration"] }
dirs = "6"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
chrono = "0.4"
retro-junk-scraper = { path = "retro-junk-scraper" }
retro-junk-frontend = { path = "retro-junk-frontend" }
chd = "0.3"
nod = "1.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = "0.25"
serde_yml = "0.0.12"
log = { version = "0.4", features = ["std"] }
strip-ansi-escapes = "0.2"
csv = "1"
pathdiff = "0.2"
env_logger = "0.11"
uuid = { version = "1", features = ["v7", "serde"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

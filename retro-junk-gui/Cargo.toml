[package]
name = "retro-junk-gui"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "retro-junk-gui"
path = "src/main.rs"

[lib]
name = "retro_junk_gui"
path = "src/lib.rs"

[dependencies]
retro-junk-backend = { workspace = true }
retro-junk-lib.workspace = true
retro-junk-archive.workspace = true
retro-junk-archive-import.workspace = true
retro-junk-dat.workspace = true
retro-junk-disc.workspace = true
retro-junk-core.workspace = true
retro-junk-nintendo.workspace = true
retro-junk-sony.workspace = true
retro-junk-sega.workspace = true
retro-junk-microsoft.workspace = true
retro-junk-frontend.workspace = true
retro-junk-db.workspace = true
retro-junk-catalog.workspace = true
retro-junk-import.workspace = true
retro-junk-io.workspace = true
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["file", "image"] }
rfd = "0.15"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
pathdiff.workspace = true
toml.workspace = true
dirs.workspace = true
sha2.workspace = true
chrono.workspace = true
retro-junk-scraper.workspace = true
tokio.workspace = true
futures.workspace = true
env_logger.workspace = true
muda = "0.19"
egui_table = "0.9"
egui-phosphor = "0.13"

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["eframe"] }
tempfile = "3"
image.workspace = true

[package.metadata.dist]
dist = true

[package.metadata.dist.dependencies.apt]
libgtk-3-dev = '*'
libxcb-render0-dev = '*'
libxcb-shape0-dev = '*'
libxcb-xfixes0-dev = '*'
libxkbcommon-dev = '*'

[lints]
workspace = true
